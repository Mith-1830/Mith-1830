<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Mithun R I — QA Automation Engineer</title>
  <desc id="desc">A dark futuristic banner representing Playwright, TypeScript, API testing, CI/CD and RPA.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B16"/>
      <stop offset="0.55" stop-color="#0B1024"/>
      <stop offset="1" stop-color="#111B38"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#35D0FF"/>
      <stop offset="0.5" stop-color="#7C5CFF"/>
      <stop offset="1" stop-color="#2EAD33"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <path d="M0 305 C220 235 330 355 520 285 S820 235 1200 295" fill="none" stroke="#26345E" stroke-width="2"/>
  <path d="M0 320 C220 250 330 370 520 300 S820 250 1200 310" fill="none" stroke="#172345" stroke-width="2"/>

  <g opacity=".35" stroke="#35D0FF" stroke-width="1">
    <path d="M40 55H420"/><path d="M40 72H330"/><path d="M850 70H1160"/>
    <path d="M910 87H1160"/><path d="M880 104H1080"/>
  </g>

  <g fill="#35D0FF" filter="url(#glow)">
    <circle cx="1020" cy="58" r="4"/><circle cx="1080" cy="118" r="3"/><circle cx="1130" cy="82" r="5"/>
  </g>

  <g transform="translate(760 100)">
    <rect x="0" y="0" width="330" height="185" rx="16" fill="#0A1020" stroke="#334777" stroke-width="2"/>
    <rect x="18" y="18" width="294" height="130" rx="10" fill="#070B14"/>
    <circle cx="34" cy="34" r="5" fill="#FF6B6B"/>
    <circle cx="51" cy="34" r="5" fill="#FFD166"/>
    <circle cx="68" cy="34" r="5" fill="#2EAD33"/>
    <path d="M42 78h75M42 97h120M42 116h95" stroke="#35D0FF" stroke-width="5" stroke-linecap="round"/>
    <path d="M205 70h78M205 89h55M205 108h70" stroke="#7C5CFF" stroke-width="5" stroke-linecap="round"/>
    <rect x="125" y="160" width="80" height="8" rx="4" fill="#334777"/>
    <path d="M75 185h180" stroke="#334777" stroke-width="5" stroke-linecap="round"/>
  </g>

  <g transform="translate(45 62)">
    <text x="0" y="48" fill="#F4F7FF" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700">MITHUN R I</text>
    <rect x="0" y="70" width="440" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="0" y="118" fill="#35D0FF" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">QA AUTOMATION ENGINEER</text>
    <text x="0" y="153" fill="#B9C5E2" font-family="Arial, Helvetica, sans-serif" font-size="18">Playwright • TypeScript • UI &amp; API Automation</text>
    <text x="0" y="181" fill="#B9C5E2" font-family="Arial, Helvetica, sans-serif" font-size="18">Selenium • CI/CD • RPA / Blue Prism</text>
  </g>

  <g transform="translate(48 275)">
    <rect width="138" height="38" rx="19" fill="#101A34" stroke="#2EAD33"/>
    <text x="69" y="25" text-anchor="middle" fill="#DFFFE2" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">PLAYWRIGHT</text>
    <rect x="150" width="128" height="38" rx="19" fill="#101A34" stroke="#35D0FF"/>
    <text x="214" y="25" text-anchor="middle" fill="#DFF8FF" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">TYPESCRIPT</text>
    <rect x="290" width="106" height="38" rx="19" fill="#101A34" stroke="#7C5CFF"/>
    <text x="343" y="25" text-anchor="middle" fill="#EEE9FF" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">API TESTING</text>
    <rect x="408" width="100" height="38" rx="19" fill="#101A34" stroke="#35D0FF"/>
    <text x="458" y="25" text-anchor="middle" fill="#DFF8FF" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">CI/CD</text>
  </g>
</svg>
